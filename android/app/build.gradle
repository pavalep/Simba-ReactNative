apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// react-native-config v1.7.2 (codegenConfig enabled): registers the
// `dotenv.gradle` script so .env values get baked into the host app's
// BuildConfig at assembleDebug time. Required for RNCConfigModule to
// resolve BuildConfig on the New Architecture. See README of
// react-native-config for the manual-link instruction we keep here.
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// ─── V21 P02 T02.02 (D-013) — fail-fast env validator ────────────────
// Without this, a missing `android/.env` produces a confusing
// Gradle error deep inside the react-native-config `dotenv.gradle`
// apply. With this, the build fails immediately at the top with a
// clear "do this, then re-run" message.
//
// We check for the .env file (not the keys inside it — empty values
// are accepted for "not used" adapters; see `android/.env.example`).
def envFile = rootProject.file('.env')
def envExampleFile = rootProject.file('.env.example')
if (!envFile.exists()) {
    throw new GradleException(
        "android/.env is missing. " +
        "Copy android/.env.example to android/.env and fill in the keys. " +
        "See md/SIMBA_V21_ENV.md for the quick-start."
    )
}
if (!envExampleFile.exists()) {
    throw new GradleException(
        "android/.env.example is missing. " +
        "It should be checked in next to this build.gradle. " +
        "Re-add it from git (md/ files are not authoritative)."
    )
}

// V23 W24 D-040b: react-native-config restored at 1.7.2 (latest).
// Earlier 1.5.10 / 1.7.0-1.7.2 bridgeless failures traced to the
// module not being a TurboModule — 1.7.2 ships codegenConfig which
// generates TurboModule bindings at build time, so the new arch
// registers it natively. The babel-dotenv detour is reverted; see
// babel.config.js (no plugin block) and src/constants/env.ts
// (re-imports react-native-config).

/**
 * V21 W4 P16 (T16.01) — reusable `validateEnv` Gradle task.
 *
 * Reuses the same checks as the inline fail-fast above (which still
 * runs at script-eval time, so a missing `.env` fails the build even
 * before this task is reached). The task form is useful as a
 * standalone pre-flight check (e.g. `./gradlew :app:validateEnv`)
 * and for explicit wiring via `tasks.named('assembleRelease')
 * { dependsOn validateEnv }`.
 */
tasks.register("validateEnv") {
    group = "verification"
    description = "Verify android/.env + the release signing env vars exist. Re-runnable."
    doLast {
        if (!envFile.exists()) {
            throw new GradleException(
                "android/.env is missing. " +
                "Copy android/.env.example to android/.env and fill in the keys. " +
                "See md/SIMBA_V21_ENV.md for the quick-start."
            )
        }
        if (!envExampleFile.exists()) {
            throw new GradleException(
                "android/.env.example is missing. " +
                "It should be checked in next to this build.gradle."
            )
        }
        // Release-only check: the 4 KEYSTORE_* vars are only needed for
        // release builds, so only enforce them when the task that runs
        // is a release task. `gradle.startParameter.taskNames` lists the
        // tasks requested on the command line.
        def requestedTasks = gradle.startParameter.taskNames
        def isReleaseRun = requestedTasks.any { it.toLowerCase().contains("release") }
        if (isReleaseRun) {
            def ksVars = [
                "KEYSTORE_PATH"     : System.getenv("KEYSTORE_PATH"),
                "KEYSTORE_PASSWORD"  : System.getenv("KEYSTORE_PASSWORD"),
                "KEY_ALIAS"          : System.getenv("KEY_ALIAS"),
                "KEY_PASSWORD"       : System.getenv("KEY_PASSWORD"),
            ]
            def missing = ksVars.findAll { k, v -> !v }.keySet()
            if (!missing.isEmpty()) {
                throw new GradleException(
                    "Release build requires env vars: ${missing.sort().join(', ')}. " +
                    "See md/SIMBA_V21_KEYSTORE.md."
                )
            }
        }
    }
}

// Wire release builds to run validateEnv first. Debug builds skip this
// (debug-signed APKs are fine — they only run on developer machines).
afterEvaluate {
    def releaseTasks = tasks.matching { it.name.toLowerCase().contains("release") }
    releaseTasks.configureEach { dependsOn "validateEnv" }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 *
 * V21 W4 P13 (D-002): flipped to `true` after proguard-rules.pro was
 * populated with keep rules for the player module + 3rd-party libs
 * (TanStack Query, react-navigation, Zustand, MMKV, react-native-svg,
 * Reanimated). See `android/app/proguard-rules.pro` for the rules and
 * `md/SIMBA_MOBILE_V21_TRACKER.md` T13.02 for the audit.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.simba.player"
    defaultConfig {
        applicationId "com.simba.player"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1.0"
        // react-native-config's BuildConfig is generated under the
        // host app's namespace (com.simba.player) since v1.5.6 — the
        // library auto-resolves that from the Application class
        // package. Pin it explicitly for safety: dotenv.gradle reads
        // `resValue "string", "build_config_package"` to tell the
        // lib's RNCConfigModule which BuildConfig to load.
        resValue "string", "build_config_package", "com.simba.player"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                abiFilters "arm64-v8a", "x86_64"
                // V22+ D-033 root-cause fix: consumer's ndkVersion in
                // android/build.gradle is bumped to NDK r28 (LLVM 18
                // libc++_shared.so). With r28, the cxx output emits an
                // LLVM 18 libc++_shared.so that is ABI-compatible with
                // the lib's prebuilt libmpv.so (LLVM 17+ libc++). No
                // per-target STL override needed — the standard
                // c++_shared (RN prefab default) now Just Works.
            }
        }
    }

    packagingOptions {
        // Phase 28: libmpv + libav* + libplayer packaging moved to
        // react-native-media-player/android/build.gradle (the module's AAR
        // packages these .so files and ships them transitively via
        // `implementation project(':react-native-media-player')`).
        //
        // V22+ D-033 (NDK r28 + libc++ path-pinning):
        //
        // libmpv.so (from the lib's AAR, mpv-android 2026-08-11
        // prebuilts) requires `__from_chars_floating_point`, a libc++
        // symbol only present in mpv-android's custom-built libc++
        // (LLVM 17+). Neither NDK r27.x nor NDK r28 stock libc++
        // provides it. So we cannot ship the NDK's libc++_shared.so —
        // only the mpv-android-bundled one.
        //
        // The consumer's CMake cxx output always emits a copy of
        // libc++_shared.so from the active NDK toolchain (single-<abi>/
        // merged path). AGP merge default conflict resolution keeps
        // that copy at the single-<abi>/ path in the APK — which would
        // ship NDK libc++ (no symbol) instead of the lib's AAR libc++
        // (has symbol). Drop the cxx-emitted single-<abi> copy via
        // `excludes += ["lib/*/libc++_shared.so"]` so the consumer's
        // nested `lib/<abi>/<abi>/libc++_shared.so` (we restored the
        // lib's mpv-android copy here) is the only libc++_shared.so
        // that reaches the APK. libmpv.so can then dlopen() the
        // symbol it needs.
        //
        // NDK r28 alone (LLVM 18 libc++) is ABI-compatible with the
        // mpv-android LLVM 17+ libc++ for everything else, so prefab
        // + RN prefab packages + autolinked libs (fbjni, jsi,
        // reactnative, reanimated, worklets, screens, nitro-modules,
        // etc.) keep working. The only symbol that ever moves between
        // libc++ versions is __from_chars_floating_point (added in
        // LLVM 17), and mpv-android ships its own libc++ precisely
        // because it relies on that symbol.
        //
        // V22.0.0 / 1.5.8 (D-038): drop the lib's AAR-bundled
        // mpv-android 2026-08-11 binaries (which render as black
        // SurfaceView on the x86_64 GFXSTREAM emulator used by the
        // SIMBA player audit). The consumer supplies the working
        // pre-mpv-2026-08-11 bundle in app/src/main/jniLibs/<abi>/<abi>/.
        // After AGP merges, the AAR's libmpv lands at
        // lib/<abi>/libmpv.so (single) and the consumer's nested lands
        // at lib/<abi>/<abi>/libmpv.so (path doubling on consumer
        // contribution). excludes drops the AAR's single-<abi> path so
        // only the consumer's nested OLD copy survives into the APK.
        jniLibs {
            // V22+ D-033: libc++_shared.so is rewritten by the
            // LibCppSharedReplacementTask (registered below in the
            // androidComponents block) at the merged_native_libs
            // stage — packagingOptions.excludes can't distinguish by
            // source path, so the post-merge task is the only proper
            // place to swap NDK r28's stock libc++ for mpv-android's
            // LLVM 17+ libc++ (the only one that has
            // __from_chars_floating_point, which libmpv.so needs).
            // See androidComponents block at end of file.
            excludes += ["lib/*/libmpv.so"]
            excludes += ["lib/*/libavcodec.so"]
            excludes += ["lib/*/libavdevice.so"]
            excludes += ["lib/*/libavfilter.so"]
            excludes += ["lib/*/libavformat.so"]
            excludes += ["lib/*/libavutil.so"]
            excludes += ["lib/*/libswresample.so"]
            excludes += ["lib/*/libswscale.so"]
            excludes += ["lib/*/libOpenCL.so"]
            pickFirst "lib/**/libmpv.so"
            pickFirst "lib/**/libplayer.so"
            pickFirst "lib/**/libavcodec.so"
            pickFirst "lib/**/libavdevice.so"
            pickFirst "lib/**/libavfilter.so"
            pickFirst "lib/**/libavformat.so"
            pickFirst "lib/**/libavutil.so"
            pickFirst "lib/**/libswresample.so"
            pickFirst "lib/**/libswscale.so"
            pickFirst "lib/**/libOpenCL.so"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // V21 W4 P13 (D-001): release signing config reads from env
        // vars (KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS /
        // KEY_PASSWORD) so the keystore + credentials never enter
        // version control. CI restores the keystore via base64
        // (see md/SIMBA_V21_ENV.md §5 + md/SIMBA_V21_KEYSTORE.md).
        //
        // Build fails fast if any of the 4 vars is missing — better
        // to fail at the top of the build than to silently ship an
        // unsigned (or debug-signed) release APK.
        //
        // NB: `signingConfigs` blocks are evaluated eagerly during
        // project configuration, regardless of which variant is being
        // built. So `installDebug` (which never touches release
        // signing) must NOT trip this guard. Gate the check on the
        // requested task names — only enforce when an actual release-
        // packaging task is on the command line.
        //
        // We trigger on:
        //   • bare aggregate tasks (`assemble`, `build`, `bundle`,
        //     `install`) — these build ALL variants, including release
        //   • variant-suffixed packaging tasks (`assembleRelease`,
        //     `bundleRelease`, `installRelease`, `packageRelease`,
        //     `signingReport`) — these consume the signingConfig
        //
        // We deliberately do NOT trigger on build-only tasks like
        // `buildCMakeRelease`, `configureCMakeRelease`, or
        // `externalNativeBuildCleanRelease` — those only compile
        // native code and don't touch the signing keystore.
        release {
            def requestedTasks = gradle.startParameter.taskNames
            def isReleasePackaging = requestedTasks.any { name ->
                def n = name.toLowerCase()
                // Bare aggregates that build every variant.
                if (n == "assemble" || n == "build" ||
                    n == "bundle"   || n == "install") return true
                // Variant-suffixed packaging tasks.
                if (n.endsWith("release") &&
                    (n.contains("assemble") || n.contains("bundle") ||
                     n.contains("install")  || n.contains("package") ||
                     n.contains("signingreport"))) return true
                return false
            }
            if (!isReleasePackaging) {
                // Debug-only invocation (or a build-only task like
                // buildCMakeRelease) — skip env-var validation. Use
                // the debug keystore as a safe placeholder so the
                // signingConfig block still resolves; the release
                // variant is never signed in this run.
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                return
            }
            def ksPath = System.getenv("KEYSTORE_PATH")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            def ksAlias = System.getenv("KEY_ALIAS")
            def keyPass = System.getenv("KEY_PASSWORD")
            if (!ksPath || !ksPass || !ksAlias || !keyPass) {
                throw new GradleException(
                    "Release signing requires 4 env vars: " +
                    "KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD. " +
                    "Missing: " +
                    ([
                        ("KEYSTORE_PATH=" + (ksPath ?: "<unset>")),
                        ("KEYSTORE_PASSWORD=" + (ksPass ? "<set>" : "<unset>")),
                        ("KEY_ALIAS=" + (ksAlias ?: "<unset>")),
                        ("KEY_PASSWORD=" + (keyPass ? "<set>" : "<unset>"))
                    ].findAll { it.endsWith("<unset>") }.join(", ")) +
                    ". See md/SIMBA_V21_KEYSTORE.md for keystore generation " +
                    "and md/SIMBA_V21_ENV.md §5 for CI setup."
                )
            }
            storeFile file(ksPath)
            storePassword ksPass
            keyAlias ksAlias
            keyPassword keyPass
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // V21 W4 P13 (D-001): use the env-var-backed signing
            // config instead of signingConfigs.debug (which was the
            // P0 defect — debug-signed release APK can't be installed
            // via Play Store and trips Google's integrity checks).
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    // Workaround: react-native-media-player declares a `debugImplementation`
    // dep on `com.squareup.leakcanary:leakcanary-android:3.0.0-alpha-8`
    // (heap-monitor for devs). That version isn't published to Maven Central,
    // Google Maven, or JitPack, so `assembleDebug` fails to resolve it. We
    // don't ship heap-monitoring to QA/test devices, so exclude the dep.
    configurations.all {
        exclude group: 'com.squareup.leakcanary', module: 'leakcanary-android'
    }

    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Media notification service (MediaSession, MediaStyle, MediaMetadata)
    implementation("androidx.media:media:1.7.0")

    // Import the Firebase BoM — ensures all Firebase libs use compatible versions
    implementation platform("com.google.firebase:firebase-bom:34.17.0")

    // Firebase Analytics
    implementation("com.google.firebase:firebase-analytics")

    // Google Sign-In
    implementation("com.google.android.gms:play-services-auth:21.2.0")
}

apply plugin: "com.google.gms.google-services"

// ============================================================================
// V22+ D-033 root-cause fix (proper): per-variant Gradle task that
// overwrites the merged libc++_shared.so with the mpv-android-bundled copy.
//
// Root-cause: libmpv.so (from @simba-dev/react-native-media-player's AAR,
// built against mpv-android 2026-08-11) requires the libc++ symbol
// `__from_chars_floating_point`, which is only present in mpv-android's
// custom-built libc++_shared.so. NDK r27.x and NDK r28 stock libc++
// do NOT provide this symbol (verified via llvm-nm). With consumer's
// ndkVersion bumped to NDK r28 (LLVM 18 libc++_shared.so), the
// consumer's CMake cxx output emits NDK r28's stock libc++_shared.so
// at the merged single-<abi>/ path. AGP merge default conflict
// resolution keeps that copy in the APK — which lacks the symbol
// libmpv.so needs. packagingOptions.excludes/pickFirst can't
// distinguish by source path after AGP flattens the consumer's
// nested doubled path.
//
// Proper fix: register a per-variant Gradle `DefaultTask` subclass
// (`ReplaceLibCppSharedTask`) and wire it via `merge<Variant>NativeLibs
// .finalizedBy(replaceTask)`. Gradle's native task ordering runs the
// replacement between `merge<Variant>NativeLibs` (which produces the
// merged output) and `package<Variant>` (which packs it into the APK).
//
// Why not the AGP artifact API? Verified against `gradle-api-9.3.1.jar`
// (the public API jar at
// `~/.gradle/caches/modules-2/files-2.1/com.android.tools.build/gradle-api/9.3.1/`):
//   - `SingleArtifact.MERGED_NATIVE_LIBS` (`SingleArtifact.kt:118`) is
//     declared `SingleArtifact<Directory>(DIRECTORY)` WITHOUT the
//     `Transformable` interface marker. The `wiredWithDirectories()
//     .toTransform(type)` overload in `InAndOutDirectoryOperationRequest`
//     (`OperationRequests.kt:413`) requires `Artifact.Single<Directory>,
//     Artifact.Transformable` — so this artifact is unreachable from
//     the public transform API in AGP 9.x.
//   - `ScopedArtifact` (`ScopedArtifact.kt`) only exposes three
//     transformable types: `CLASSES`, `POST_COMPILATION_CLASSES`,
//     `JAVA_RES`. There is no `ScopedArtifact.MERGED_NATIVE_LIBS`.
//   - The old `com.android.build.api.artifact.transform.TransformAction`
//     and `TransformParameters` interfaces (used in AGP 4.x-7.x) do NOT
//     exist in AGP 8.x/9.x — verified by enumerating
//     `instrumented-gradle-9.3.1.jar`: only `com.android.build.api
//     .artifact.impl.*` is present; no `transform/` subpackage.
//
// So the AGP 9.x public API cannot hook the merged-native-libs stage.
// `merge<Variant>NativeLibs.finalizedBy(...)` is the proper, first-class,
// Gradle-native fix: a named task of our own, registered in our own
// build.gradle, with explicit ordering declared via the standard
// `finalizedBy` contract — not a `doLast` shadow, not a third-party
// patch, not a post-package overwrite.
//
// Idempotent and re-runnable: the task re-applies the same
// file-content swap on every `assemble<Variant>` invocation. Up-to-
// date checking is irrelevant — the file lives in a build-dir-managed
// directory that Gradle recreates on a clean build, and we only touch
// it if it's stale (the consumer's CMake re-emits libc++_shared.so on
// each native build).
//
// This replaces the previous "**/libc++_shared.so" excludes pattern
// in packagingOptions — that workaround couldn't target the source
// path, only the final APK path.
// ============================================================================

abstract class ReplaceLibCppSharedTask extends DefaultTask {
    // The variant this task is wired for (e.g. "debug" or "release").
    // Set at registration time; @Internal because the buildDir layout
    // it derives is a build-system concern, not an input/output file.
    //
    // In Gradle 9.x / AGP 9.x the ObjectFactory only invokes the
    // @Inject no-arg ctor; the third arg of `tasks.register(name,
    // Class, arg)` is set as a property by name, NOT passed via a
    // 1-arg constructor. See https://docs.gradle.org/current/dsl/
    // org.gradle.api.tasks.TaskContainer.html#register(java.lang
    // .Class,org.gradle.api.Action). The wiring code below uses
    // `task.configure { task -> task.variantName = variantName }`.
    @Internal
    String variantName

    @javax.inject.Inject
    ReplaceLibCppSharedTask() {}

    @TaskAction
    void replaceMergedLibCppShared() {
        // Inside a Task class, `buildDir` / `rootDir` are NOT in scope
        // — resolve them via `project.layout.buildDirectory` /
        // `project.rootDir` (build-system concerns are exposed on
        // `project`, not on the Task instance).
        def capitalized = variantName.capitalize()
        def mergedDir = new File(
            // AGP lays the merged libs at
            //   build/intermediates/merged_native_libs/<variant>/merge<Variant>NativeLibs/out/lib/<abi>/libfoo.so
            // Note the trailing /lib/<abi>/ — keep the dir name split.
            project.layout.buildDirectory.dir(
                "intermediates/merged_native_libs/${variantName}/merge${capitalized}NativeLibs/out/lib"
            ).get().asFile.absolutePath
        )
        // project.rootDir for the :app subproject is `android/`,
        // so we go up one level to reach the consumer root where
        // `npm install` placed the lib's jniLibs.
        def consumerRootDir = project.rootDir.parentFile
        def libJniLibsRoot = new File(
            "${consumerRootDir}/node_modules/@simba-dev/react-native-media-player/android/src/main/jniLibs"
        )
        // Always emit the resolved paths to make diagnosis trivial.
        // Will be printed once per replaceTask invocation.
        logger.lifecycle(
            "[ReplaceLibCppSharedTask/${variantName}] mergedDir=${mergedDir.absolutePath} " +
            "exists=${mergedDir.exists()}; libJniLibsRoot=${libJniLibsRoot.absolutePath} " +
            "exists=${libJniLibsRoot.exists()}"
        )

        if (!mergedDir.exists()) {
            // Likely a build that didn't go through mergeNativeLibs
            // (e.g. an unrelated sub-task invoked in isolation). Skip.
            logger.warn(
                "[ReplaceLibCppSharedTask/${variantName}] merged_native_libs directory not found " +
                "at ${mergedDir} — skipping libc++ rewrite. AGP packaging will use whatever " +
                "it has for this build; video playback will be broken on this run."
            )
            return
        }
        if (!libJniLibsRoot.exists()) {
            logger.warn(
                "[ReplaceLibCppSharedTask/${variantName}] lib jniLibs root not found at " +
                "${libJniLibsRoot} — skipping libc++ rewrite. Re-run " +
                "`npm install` in the consumer to trigger the lib's postinstall step " +
                "(`scripts/download-native.js`). Video playback will be broken on this run."
            )
            return
        }
        def replacedAbis = []
        ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"].each { abi ->
            // mergedDir is already build/.../merge<Variant>NativeLibs/out/lib
            // — append only the ABI subdir + filename, NOT another 'lib/'
            // (that produced a double lib/lib/ target path).
            def target = new File(mergedDir, "${abi}/libc++_shared.so")
            def source = new File(libJniLibsRoot, "${abi}/libc++_shared.so")
            if (!source.exists()) {
                logger.warn(
                    "[ReplaceLibCppSharedTask/${variantName}] ${abi}: source missing — " +
                    "source=${source.absolutePath}"
                )
                return
            }
            if (!target.exists()) {
                logger.warn(
                    "[ReplaceLibCppSharedTask/${variantName}] ${abi}: target missing — " +
                    "target=${target.absolutePath}"
                )
                return
            }
            // Overwrite in place. The .bak file is a paranoia step —
            // if the source later goes missing we can recover the
            // NDK-r28 stock copy for forensics. Gradle leaves .bak
            // files alone.
            new File(target.absolutePath + ".bak").delete()
            ant.move(file: target.absolutePath,
                     tofile: target.absolutePath + ".bak",
                     overwrite: true)
            ant.copy(file: source.absolutePath,
                     tofile: target.absolutePath,
                     overwrite: true)
            def postSize = target.length()
            replacedAbis << "${abi}=${postSize}B"
        }
        if (replacedAbis) {
            logger.lifecycle(
                "[ReplaceLibCppSharedTask/${variantName}] libc++_shared.so swapped to " +
                "mpv-android's LLVM 17+ copy (with __from_chars_floating_point) for: " +
                replacedAbis.join(", ")
            )
        } else {
            logger.warn(
                "[ReplaceLibCppSharedTask/${variantName}] No ABI was replaced. The merged " +
                "native libs directory exists but no lib/<abi>/libc++_shared.so matches the " +
                "lib's mpv-android copies — investigate the merge output layout."
            )
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        // Per-variant merge task (e.g. mergeDebugNativeLibs,
        // mergeReleaseNativeLibs). Wire our replacement task via
        // finalizedBy so the swap runs after the merge commits and
        // before packageDebug pulls from the merged dir.
        //
        // IMPORTANT: AGP creates the per-variant merge tasks lazily,
        // AFTER this onVariants callback fires. Calling `tasks.findByName`
        // here returns null. We must defer the lookup to
        // `afterEvaluate` for it to see the registered merge tasks.
        // (Verified empirically: see md/W23_FINALIZEDBY_BUILD.log —
        // direct findByName in the callback logs "mergeDebugNativeLibs
        // task not found".)
        def variantName = variant.name
        def capitalized = variant.name.capitalize()
        def mergeTaskName = "merge${capitalized}NativeLibs"
        def replaceTaskName = "replace${capitalized}LibCppShared"

        afterEvaluate {
            def mergeTask = tasks.findByName(mergeTaskName)
            if (mergeTask == null) {
                logger.warn(
                    "[V22+ D-033] ${mergeTaskName} task not found at " +
                    "afterEvaluate time — skipping libc++ rewrite " +
                    "registration for variant '${variantName}'. " +
                    "(This can happen if AGP drops the merge task name " +
                    "for a future variant type. Check the variant's " +
                    "tasks with `./gradlew :app:tasks --all`.)"
                )
                return
            }
            def replaceTaskProvider = tasks.register(
                replaceTaskName, ReplaceLibCppSharedTask
            )
            replaceTaskProvider.configure { task ->
                task.variantName = variantName
                task.dependsOn(mergeTask)
                task.group = 'build'
                task.description =
                    "Replaces the merged libc++_shared.so with mpv-android's " +
                    "LLVM 17+ copy for variant '{$variantName}'. Runs after " +
                    "${mergeTaskName} via finalizedBy."
            }
            mergeTask.finalizedBy(replaceTaskProvider)
            logger.lifecycle(
                "[V22+ D-033] Registered ${replaceTaskName} as finalizer " +
                "of ${mergeTaskName} (finalizedBy + dependsOn)."
            )
        }
    }
}
