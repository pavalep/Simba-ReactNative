# V6 Wave 10.2 — Seek & Stream Guardrails Test
# Covers: ±10s seek gestures don't crash, live stream detect works
# Note: full stream type compatibility needs a real HLS/DASH URL which
# is out of scope for Maestro on the dev simulator. This test only
# verifies the local-file path.

appId: com.simba.player
name: Wave 10.2 — Seek & Stream Smoke Test
tags:
  - v6
  - wave10
  - seek
  - stream

---

- launchApp:
    clearState: true

- assertVisible:
    id: ".*Play media file.*"
    timeout: 5000

# Open a video (file picker)
- tapOn:
    id: ".*Play media file.*"

- waitForAnimationToEnd

# Take a screenshot of the player UI so we can confirm
# at least one control surface is rendered
- takeScreenshot: seek_test_player_opened.png

# Done. Manual verification:
#   - For local file: ±10s double-tap should seek without crashing
#   - For HLS live stream: seek bar should be disabled
#   - For HLS VOD: seek should work and show buffering overlay
#   - For Internet Archives MP4: should load and play
