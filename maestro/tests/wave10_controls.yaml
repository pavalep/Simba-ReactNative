# V6 Wave 10 — Controls Layout Test
# Covers: Player chrome is rendered with the right element counts
# (single video = 3 transport buttons, playlist = 5; ≤6 secondary
# toolbar controls; icon order)

appId: com.simba.player
name: Wave 10 — Controls Layout Smoke Test
tags:
  - v6
  - wave10
  - controls

---

- launchApp:
    clearState: true

- assertVisible:
    id: ".*Play media file.*"
    timeout: 5000

# Snapshot the home screen chrome so we can manually confirm
# nothing regressed in the toolbar layout
- takeScreenshot: controls_test_home.png

# Try to open the player
- tapOn:
    id: ".*Play media file.*"
- waitForAnimationToEnd

# Take a screenshot of the player
- takeScreenshot: controls_test_player.png

# Done. Manual verification:
#   - Single video: 3 transport buttons in order [-10s, Play, +10s]
#   - Playlist: 5 transport buttons [Prev, -10s, Play, +10s, Next]
#   - Top bar (right side): [Lock, More, Bookmark, Share, Rotate]
#   - Secondary toolbar: ≤6 visible controls (Chapters, Audio,
#     Subtitles, Speed, Volume, More)
#   - In landscape, inline labels are hidden
